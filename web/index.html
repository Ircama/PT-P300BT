<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PT-P300BT Label Designer — Web</title>
<link rel="icon" href="favicon.ico">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="app-header">
  <div class="brand">
    <span class="logo">🏷️</span>
    <div>
      <h1>PT-P300BT Label Designer</h1>
      <p class="subtitle">Web port of <code>printlabel.py</code> — 1:1 algorithms &amp; GUI</p>
    </div>
  </div>
  <div class="header-actions">
    <span id="support-badge" class="badge badge-warn" title="Web Serial support">Checking browser…</span>
  </div>
</header>

<div id="support-banner" class="banner hidden" role="alert">
  <strong>Web Serial not available.</strong>
  <span id="support-banner-text"></span>
</div>

<main class="layout">
  <!-- ===================== LEFT: CONTROLS ===================== -->
  <section class="panel controls" aria-label="Controls">

    <details class="group" open>
      <summary>Text &amp; Font</summary>
      <div class="group-body">
        <label class="field">
          <span>Label text <small>(one line per row)</small></span>
          <textarea id="text" rows="4" placeholder="Type your label text…"></textarea>
        </label>

        <label class="field">
          <span>Font</span>
          <select id="fontname"></select>
        </label>
        <div class="row">
          <button id="font-upload-btn" class="btn btn-ghost" type="button">Load font file…</button>
          <input id="font-upload" type="file" accept=".ttf,.otf,.ttc,.woff,.woff2" hidden>
          <span id="font-status" class="hint"></span>
        </div>

        <label class="check"><input type="checkbox" id="center_text"> Center text</label>
        <label class="check"><input type="checkbox" id="emoji_print_area"> Emoji fill print area</label>
        <label class="check"><input type="checkbox" id="mono_emoji" checked> Emoji black &amp; white</label>
        <label class="check"><input type="checkbox" id="uniform_font"> Uniform font sizing</label>

        <label class="field">
          <span>Ligature feature</span>
          <select id="ligatures"><option value="">(off)</option></select>
          <span id="ligature-status" class="hint"></span>
        </label>

        <label class="field inline">
          <span>TAB width (spaces)</span>
          <input type="number" id="tab_width" value="8" min="1" step="1">
        </label>
      </div>
    </details>

    <details class="group">
      <summary>Text tuning (advanced)</summary>
      <div class="group-body grid2">
        <label class="field inline"><span>Font scale (%)</span><input type="number" id="font_scale" value="100" step="1"></label>
        <label class="field inline"><span>Line spacing</span><input type="number" id="line_spacing" value="1.2" step="0.05"></label>
        <label class="field inline"><span>H padding (dots)</span><input type="number" id="h_padding" value="5" step="1"></label>
        <label class="field inline"><span>V shift (dots)</span><input type="number" id="v_shift" value="0" step="1"></label>
        <label class="field inline"><span>Text width (mm, 0=auto)</span><input type="number" id="text_size" value="0" step="1"></label>
        <label class="field inline"><span>Fixed width (mm, 0=off)</span><input type="number" id="fixed_width" value="0" step="1"></label>
        <label class="field inline"><span>Tape width (mm)</span><input type="number" id="tape_width" value="12" step="0.5"></label>
        <label class="field inline"><span>Fixed font size (0=auto)</span><input type="number" id="fixed_font_size" value="0" step="1"></label>
        <label class="field inline"><span>Luma low (emoji B/W)</span><input type="number" id="luma_lo" value="140" step="1"></label>
        <label class="field inline"><span>Luma high (emoji B/W)</span><input type="number" id="luma_hi" value="175" step="1"></label>
        <label class="field inline"><span>Fill color</span><input type="text" id="fill" value="black"></label>
        <label class="field inline"><span>Stroke fill</span><input type="text" id="stroke_fill" value=""></label>
        <label class="field inline"><span>Stroke width</span><input type="number" id="stroke_width" value="0" step="1"></label>
        <label class="field inline"><span>End margin (dots)</span><input type="number" id="end_margin" value="0" step="1"></label>
        <label class="check"><input type="checkbox" id="unicode"> Use Unicode escapes</label>
        <label class="check"><input type="checkbox" id="lines" checked> Show rulers/lines</label>
      </div>
    </details>

    <details class="group">
      <summary>Images</summary>
      <div class="group-body">
        <ul id="merge-list" class="merge-list"></ul>
        <div class="row">
          <button id="merge-add" class="btn btn-ghost" type="button">Add merge image…</button>
          <button id="merge-del" class="btn btn-ghost" type="button">Remove selected</button>
          <input id="merge-file" type="file" accept="image/*" hidden>
        </div>
        <div class="grid2">
          <label class="field inline"><span>Resize</span><input type="number" id="resize" value="1.0" step="0.1"></label>
          <label class="field inline"><span>X merge</span><input type="number" id="x_merge" value="0" step="1"></label>
          <label class="field inline"><span>Y merge</span><input type="number" id="y_merge" value="12" step="1"></label>
          <label class="field inline"><span>Merge gap (dots)</span><input type="number" id="merge_gap" value="0" step="1"></label>
          <label class="field inline"><span>White level</span><input type="number" id="white_level" value="240" step="1"></label>
          <label class="field inline"><span>Threshold</span><input type="number" id="threshold" value="75" step="1"></label>
        </div>
      </div>
    </details>

    <details class="group" open>
      <summary>Printer</summary>
      <div class="group-body">
        <label class="check"><input type="checkbox" id="no_print"> No print</label>
        <label class="check"><input type="checkbox" id="auto_cut"> Auto cut</label>
        <details class="subgroup">
          <summary>Printer tuning (advanced)</summary>
          <label class="check"><input type="checkbox" id="no_feed"> No feed</label>
          <label class="check"><input type="checkbox" id="raw"> Raw</label>
          <label class="check"><input type="checkbox" id="nocomp"> No compression</label>
        </details>
      </div>
    </details>

    <details class="group" open>
      <summary>Preview</summary>
      <div class="group-body">
        <label class="check"><input type="checkbox" id="preview_conv"> Show converted raster (as sent to printer)</label>
        <label class="check"><input type="checkbox" id="auto_preview" checked> Live preview</label>
      </div>
    </details>
  </section>

  <!-- ===================== RIGHT: PREVIEW ===================== -->
  <section class="panel preview" aria-label="Preview">
    <div class="preview-toolbar">
      <button id="zoom-out" class="btn btn-icon" type="button" title="Zoom out">−</button>
      <button id="zoom-in" class="btn btn-icon" type="button" title="Zoom in">+</button>
      <button id="zoom-fit" class="btn btn-ghost" type="button">Fit</button>
      <button id="zoom-tape" class="btn btn-ghost" type="button">1:1 tape</button>
      <span id="zoom-info" class="hint"></span>
      <span class="spacer"></span>
      <span id="status" class="status-pill">Type some text to see the preview.</span>
    </div>

    <div id="canvas-wrap" class="canvas-wrap">
      <canvas id="preview-canvas"></canvas>
      <div id="preview-empty" class="preview-empty">Preview</div>
    </div>

    <div class="preview-actions">
      <button id="connect-btn" class="btn btn-primary" type="button">Connect printer</button>
      <span id="port-status" class="hint">Not connected</span>
      <span class="spacer"></span>
      <button id="refresh-btn" class="btn btn-ghost" type="button">Refresh preview (F5)</button>
      <button id="save-png" class="btn btn-ghost" type="button">Save PNG…</button>
      <span class="spacer"></span>
      <button id="print-btn" class="btn btn-accent" type="button">PRINT</button>
    </div>

    <details class="group log-group" open>
      <summary>Output</summary>
      <div class="log-actions">
        <button id="log-copy" class="btn btn-ghost" type="button" title="Copy the output to the clipboard">Copy</button>
        <button id="log-clear" class="btn btn-ghost" type="button" title="Clear the output">Clear</button>
      </div>
      <pre id="log" class="log"></pre>
    </details>
  </section>
</main>

<script src="printer.js"></script>
<script src="label.js"></script>
<script src="app.js"></script>
</body>
</html>
